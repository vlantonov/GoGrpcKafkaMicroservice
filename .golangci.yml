version: "2"

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - revive
  exclusions:
    # Exclude generated protobuf code from all linters.
    paths:
      - gen
  settings:
    revive:
      rules:
        - name: exported
          disabled: false

formatters:
  enable:
    - gofmt
  exclusions:
    paths:
      - gen
